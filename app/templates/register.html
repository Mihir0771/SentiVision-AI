{% extends "base.html" %}

{% block title %}Create Account — SentiVision AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5 col-xl-4">
            
            <div class="card border-0 rounded-4 shadow-lg p-4 p-md-5 auth-card">
                <div class="text-center mb-4">
                    <div class="brand-icon-wrapper mb-3 d-inline-flex p-3 rounded-circle bg-accent-soft">
                        <i class="fas fa-user-plus fa-2x text-accent"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Create Account</h3>
                    <p class="text-secondary small">Join SentiVision AI to track and export sentiment analytics</p>
                </div>

                <form method="POST" action="{{ url_for('auth.register') }}">
                    <div class="mb-3">
                        <label for="username" class="form-label small fw-semibold text-secondary">Username</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control" id="username" name="username" required placeholder="johndoe" minlength="3">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="email" class="form-label small fw-semibold text-secondary">Email Address</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-envelope"></i></span>
                            <input type="email" class="form-control" id="email" name="email" required placeholder="john@example.com">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••" minlength="6">
                        </div>
                        <div class="form-text small">At least 6 characters</div>
                    </div>

                    <div class="mb-4">
                        <label for="confirm_password" class="form-label small fw-semibold text-secondary">Confirm Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-check"></i></span>
                            <input type="password" class="form-control" id="confirm_password" name="confirm_password" required placeholder="••••••••" minlength="6">
                        </div>
                    </div>

                    <button type="submit" class="btn btn-accent w-100 py-2 fw-semibold">
                        <i class="fas fa-user-check me-2"></i>Register
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-secondary small mb-0">
                        Already have an account? 
                        <a href="{{ url_for('auth.login') }}" class="text-accent fw-semibold text-decoration-none">Sign In</a>
                    </p>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
