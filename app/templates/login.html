{% extends "base.html" %}

{% block title %}Sign In — SentiVision AI{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-5 col-xl-4">
            
            <div class="card border-0 rounded-4 shadow-lg p-4 p-md-5 auth-card">
                <div class="text-center mb-4">
                    <div class="brand-icon-wrapper mb-3 d-inline-flex p-3 rounded-circle bg-accent-soft">
                        <i class="fas fa-brain fa-2x text-accent"></i>
                    </div>
                    <h3 class="fw-bold mb-1">Welcome Back</h3>
                    <p class="text-secondary small">Sign in to access your sentiment records &amp; history</p>
                </div>

                <form method="POST" action="{{ url_for('auth.login') }}">
                    <div class="mb-3">
                        <label for="identifier" class="form-label small fw-semibold text-secondary">Username or Email</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-user"></i></span>
                            <input type="text" class="form-control" id="identifier" name="identifier" required placeholder="admin or you@example.com">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label small fw-semibold text-secondary">Password</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-lock"></i></span>
                            <input type="password" class="form-control" id="password" name="password" required placeholder="••••••••">
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center mb-4">
                        <div class="form-check">
                            <input class="form-check-input" type="checkbox" id="remember" name="remember">
                            <label class="form-check-label small text-secondary" for="remember">Remember me</label>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-accent w-100 py-2 fw-semibold">
                        <i class="fas fa-sign-in-alt me-2"></i>Sign In
                    </button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-secondary small mb-0">
                        Don't have an account? 
                        <a href="{{ url_for('auth.register') }}" class="text-accent fw-semibold text-decoration-none">Create one</a>
                    </p>
                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
