<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60" width="280" height="60">
  <defs>
    <linearGradient id="brand-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#9333EA"/>
    </linearGradient>
    <linearGradient id="wave-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366F1"/>
      <stop offset="50%" stop-color="#8B5CF6"/>
      <stop offset="100%" stop-color="#A855F7"/>
    </linearGradient>
  </defs>

  <!-- Brain / neural icon -->
  <g transform="translate(6,6)">
    <!-- Outer brain silhouette -->
    <path d="M24 4 C16 4 10 10 10 18 C10 22 12 25 14 27 C12 29 10 32 10 36
             C10 42 14 46 20 46 C22 46 24 45 26 44 C28 45 30 46 32 46
             C38 46 42 42 42 36 C42 32 40 29 38 27 C40 25 42 22 42 18
             C42 10 36 4 28 4 Z"
          fill="url(#brand-grad)" opacity="0.15" stroke="url(#brand-grad)"
          stroke-width="1.5"/>

    <!-- Left hemisphere wave -->
    <path d="M18 16 Q22 12 26 18 Q22 24 18 20" fill="none"
          stroke="url(#wave-grad)" stroke-width="2" stroke-linecap="round"/>
    <!-- Right hemisphere wave -->
    <path d="M26 18 Q30 12 34 18 Q30 24 26 20" fill="none"
          stroke="url(#wave-grad)" stroke-width="2" stroke-linecap="round"/>

    <!-- Sentiment wave (EEG-style) -->
    <path d="M12 34 Q16 28 20 34 Q24 40 28 34 Q32 28 36 34 Q38 38 40 34"
          fill="none" stroke="url(#wave-grad)" stroke-width="2.2"
          stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Neural dots -->
    <circle cx="18" cy="16" r="2" fill="#6366F1"/>
    <circle cx="34" cy="16" r="2" fill="#8B5CF6"/>
    <circle cx="26" cy="26" r="2.5" fill="#7C3AED"/>
    <circle cx="14" cy="27" r="1.5" fill="#6366F1" opacity="0.7"/>
    <circle cx="38" cy="27" r="1.5" fill="#A855F7" opacity="0.7"/>

    <!-- Neural connections -->
    <line x1="18" y1="16" x2="26" y2="26" stroke="#7C3AED" stroke-width="0.8" opacity="0.5"/>
    <line x1="34" y1="16" x2="26" y2="26" stroke="#7C3AED" stroke-width="0.8" opacity="0.5"/>
  </g>

  <!-- Text: SentiVision -->
  <text x="60" y="32" font-family="'Segoe UI', Arial, sans-serif"
        font-size="22" font-weight="700" fill="url(#brand-grad)"
        letter-spacing="0.5">
    Senti<tspan fill="#9333EA">Vision</tspan>
  </text>

  <!-- Text: AI -->
  <text x="210" y="32" font-family="'Segoe UI', Arial, sans-serif"
        font-size="22" font-weight="300" fill="#9333EA"
        letter-spacing="1">AI</text>

  <!-- Tagline -->
  <text x="60" y="48" font-family="'Segoe UI', Arial, sans-serif"
        font-size="9" fill="#6B7280" letter-spacing="2.5">
    SENTIMENT ANALYZER
  </text>
</svg>
